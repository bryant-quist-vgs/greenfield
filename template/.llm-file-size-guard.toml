# Repository policy for `llm-size-guard check` (run by `make llm-size-guard`).
#
# The limits are stated here so that the policy is visible in the repository and does not
# depend on a machine's user or system configuration:
#   warning  500 lines /  5,000 words / 40,000 characters
#   error    800 lines /  8,000 words / 64,000 characters
# A file that reaches the warning level is split by responsibility before it reaches the
# error level (docs/greenfield/specification.md, "Size").
#
# No [selection] is set: the guard's default list of source and document extensions
# applies. The toolchain change (backlog B001) confirms that list covers the project's
# source files and adds a [selection] table only if it does not.

[thresholds]
warn_lines = 500
fail_lines = 800
words_per_line = 10
chars_per_line = 80
growth_lines = 100
defer_days = 7

[tracking]
# Accept and defer decisions live in this tracked file, not in per-machine state, so a
# suppression is reviewed like any other change and the gate gives the same answer on
# every machine and in CI. The file appears the first time one is recorded.
state_path = ".llm-size-guard-state.json"
